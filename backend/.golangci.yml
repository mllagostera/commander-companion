version: "2"
run:
  issues-exit-code: 1
  tests: true
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - cyclop
    - depguard
    - dupl
    - durationcheck
    - err113
    - errcheck
    - errname
    - errorlint
    - forbidigo
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - makezero
    - mnd
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - promlinter
    - revive
    - sqlclosecheck
    - staticcheck
    - testableexamples
    - testpackage
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace
  settings:
    depguard:
      rules:
        # ARCHITECTURE.md: "Handler: transport layer -- the only layer that's
        # actually decoupled from infrastructure. It knows nothing about SQL or
        # the Postgres driver, only about Service."
        #
        # This is the import-level half of that rule, checked natively here
        # instead of by a grep in .github/scripts/check-architecture.sh, so it
        # rides the golangci-lint gate that branch protection already requires.
        # The half depguard cannot express -- a slice reaching into ANOTHER
        # slice's sqlc Queries -- stays in that script, because Service and
        # Queries live in the same Go package and no import-level tool can tell
        # the two apart.
        handlers-know-no-persistence:
          files:
            - "**/internal/*/handler.go"
          deny:
            - pkg: "github.com/jackc/pgx"
              desc: "the Handler talks to the Service only; move persistence into service.go"
            - pkg: "database/sql"
              desc: "the Handler talks to the Service only; move persistence into service.go"
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 15
    govet:
      disable:
        - fieldalignment
      enable-all: true
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
          severity: warning
          disabled: false
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
