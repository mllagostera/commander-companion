version: '3.8'

services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_URL=postgres://postgres:postgres@db:5432/commander?sslmode=disable
      - JWT_SECRET=dev-insecure-jwt-secret-change-me
      - ACCESS_TOKEN_TTL=15m
      - REFRESH_TOKEN_TTL=720h
      - GOOGLE_CLIENT_ID=
      - CORS_ALLOWED_ORIGINS=
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=commander
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
