openapi: 3.1.0
info:
  title: Commander Companion API
  version: 0.1.0
  description: API para la aplicación Commander Companion.
servers:
  - url: http://localhost:8080/api/v1
    description: Servidor de desarrollo
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    GoogleLoginRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          description: id_token emitido por Google Identity Services en el cliente.
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Segundos hasta que expira el access_token.
        user:
          $ref: '#/components/schemas/User'
    Deck:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        commander:
          type: string
        moxfield_id:
          type: string
          nullable: true
    CreateDeckRequest:
      type: object
      required: [name, commander]
      properties:
        name:
          type: string
        commander:
          type: string
        moxfield_id:
          type: string
    ImportMoxfieldRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: URL completa del deck en Moxfield (https://moxfield.com/decks/{id}) o solo el ID público.
    Game:
      type: object
      properties:
        id:
          type: string
          format: uuid
        playgroup_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [pending, active, finished]
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        players:
          type: array
          items:
            $ref: '#/components/schemas/GamePlayer'
    CreateGameRequest:
      type: object
      properties:
        playgroup_id:
          type: string
          format: uuid
          description: Opcional; asocia la partida a un grupo de juego existente.
    JoinGameRequest:
      type: object
      required: [deck_id]
      properties:
        deck_id:
          type: string
          format: uuid
          description: Debe pertenecer al usuario autenticado.
    GamePlayer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        game_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        deck_id:
          type: string
          format: uuid
        life_total:
          type: integer
        poison_counters:
          type: integer
        energy_counters:
          type: integer
        experience_counters:
          type: integer
        is_eliminated:
          type: boolean
    GameAction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        game_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        target_id:
          type: string
          format: uuid
          nullable: true
        action_type:
          type: string
        payload:
          type: object
        created_at:
          type: string
          format: date-time
    Playgroup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/PlaygroupMember'
    PlaygroupMember:
      type: object
      properties:
        playgroup_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
    CreatePlaygroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
    AddMemberRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid
          description: Debe ser un usuario existente; quien invita debe ya ser miembro del grupo.
    UserStatsResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        games_played:
          type: integer
        games_won:
          type: integer
        total_damage_dealt:
          type: integer
        total_commander_damage_dealt:
          type: integer
        total_eliminations:
          type: integer
    DeckStatsResponse:
      type: object
      properties:
        deck_id:
          type: string
          format: uuid
        games_played:
          type: integer
        games_won:
          type: integer
        highest_life_total_achieved:
          type: integer
        total_commander_damage_dealt:
          type: integer
    PlaygroupStatsResponse:
      type: object
      properties:
        playgroup_id:
          type: string
          format: uuid
        games_played:
          type: integer
          description: Partidas finalizadas asociadas a este grupo.
        members:
          type: array
          items:
            $ref: '#/components/schemas/PlaygroupMemberStats'
    PlaygroupMemberStats:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        games_played:
          type: integer
        games_won:
          type: integer
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      summary: Registrar usuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Username o email ya registrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      summary: Iniciar sesión con email y password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Credenciales inválidas, o la cuenta usa Google sign-in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/google:
    post:
      summary: Iniciar sesión (o registrarse) con Google
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: Login exitoso; se crea la cuenta o se vincula a una existente si hace falta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: id_token faltante, inválido o con email no verificado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Google sign-in no está configurado en el servidor (falta GOOGLE_CLIENT_ID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/refresh:
    post:
      summary: Refrescar token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token renovado (el refresh token anterior queda revocado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Refresh token inválido, expirado o ya revocado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      summary: Cerrar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Sesión terminada (revoca el refresh token indicado)
  /auth/me:
    get:
      summary: Obtener perfil actual
      responses:
        '200':
          description: Datos del usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{id}:
    get:
      summary: Obtener usuario
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle del usuario
    patch:
      summary: Actualizar usuario
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Usuario actualizado

  /playgroups:
    get:
      summary: Listar los grupos de juego del usuario autenticado
      responses:
        '200':
          description: Grupos de los que el usuario autenticado es miembro
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Playgroup'
    post:
      summary: Crear grupo (el creador queda como primer miembro)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaygroupRequest'
      responses:
        '201':
          description: Grupo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playgroup'
        '400':
          description: Falta el nombre del grupo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /playgroups/{id}:
    get:
      summary: Obtener grupo
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle del grupo, si el usuario autenticado es miembro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playgroup'
        '404':
          description: No existe, o el usuario autenticado no es miembro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /playgroups/{id}/members:
    post:
      summary: Añadir un miembro al grupo (solo un miembro existente puede invitar)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: Miembro añadido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaygroupMember'
        '404':
          description: Grupo o usuario a añadir no encontrados (o quien invita no es miembro del grupo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: El usuario ya es miembro del grupo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /decks:
    get:
      summary: Listar decks
      responses:
        '200':
          description: Lista de decks del usuario autenticado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deck'
    post:
      summary: Crear deck manualmente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeckRequest'
      responses:
        '201':
          description: Deck creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
  /decks/import/moxfield:
    post:
      summary: Importar desde Moxfield
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportMoxfieldRequest'
      responses:
        '201':
          description: Deck importado (nombre y comandante tomados de Moxfield)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
        '400':
          description: URL/ID inválido, o el deck de Moxfield no tiene comandante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe ningún deck público de Moxfield con ese ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /decks/{id}:
    get:
      summary: Obtener deck
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle del deck
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
        '404':
          description: No existe, o no pertenece al usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Modificar deck
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deck actualizado
    delete:
      summary: Eliminar deck
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deck eliminado
        '404':
          description: No existe, o no pertenece al usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /games:
    get:
      summary: Listar partidas
      responses:
        '200':
          description: Historial de partidas
    post:
      summary: Crear partida
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameRequest'
      responses:
        '201':
          description: Partida creada (estado pending)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: playgroup_id inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /games/{id}/join:
    post:
      summary: Unirse a la partida con un deck propio
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinGameRequest'
      responses:
        '200':
          description: Jugador añadido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamePlayer'
        '404':
          description: Partida o deck no encontrados (o el deck no pertenece al usuario autenticado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La partida ya no acepta jugadores, o el usuario ya está en la partida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /games/{id}/leave:
    post:
      summary: Salir de la partida (solo en pending)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Jugador removido
        '404':
          description: El usuario autenticado no es miembro de esta partida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La partida ya no está en pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /games/{id}/start:
    post:
      summary: Iniciar partida
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Partida activa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '409':
          description: La partida no está en pending, o no tiene suficientes jugadores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /games/{id}/finish:
    post:
      summary: Finalizar partida
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Partida finalizada (lanza recálculo de estadísticas)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '409':
          description: Solo una partida activa puede finalizarse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /games/{id}/actions:
    post:
      summary: Registrar acción en la partida
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor_id, action_type]
              properties:
                actor_id:
                  type: string
                  format: uuid
                  description: ID del GamePlayer (no del usuario) que origina la acción.
                target_id:
                  type: string
                  format: uuid
                  description: ID del GamePlayer afectado; si se omite, afecta al propio actor.
                action_type:
                  type: string
                  enum: [LifeChange, CombatDamage, CommanderDamage, PoisonCounter, TurnStart, TurnEnd, Elimination]
                payload:
                  type: object
                  description: 'Para LifeChange/CombatDamage/CommanderDamage/PoisonCounter: { "amount": <integer> }.'
      responses:
        '400':
          description: action_type inválido, o payload.amount faltante/no numérico
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Partida, actor o target no encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La partida no está activa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Acción registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameAction'
  /games/{id}/timeline:
    get:
      summary: Obtener historial completo de acciones
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Línea de tiempo de la partida

  /statistics/user:
    get:
      summary: Obtener estadísticas globales del usuario autenticado
      responses:
        '200':
          description: Estadísticas del usuario, recalculadas al finalizar cada partida (ceros si nunca jugó)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatsResponse'
  /statistics/deck/{id}:
    get:
      summary: Obtener estadísticas de un deck del usuario autenticado
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estadísticas del deck (ceros si nunca jugó una partida finalizada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckStatsResponse'
        '404':
          description: No existe, o no pertenece al usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /statistics/playgroup/{id}:
    get:
      summary: Obtener estadísticas de un grupo
      description: Calculadas en vivo sobre las partidas finalizadas del grupo (no hay tabla de resumen precalculada).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estadísticas agregadas por miembro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaygroupStatsResponse'

  /sync/moxfield:
    post:
      summary: Iniciar sincronización con Moxfield
      responses:
        '202':
          description: Sincronización en proceso
  /sync/status:
    get:
      summary: Obtener estado de la sincronización
      responses:
        '200':
          description: Estado actual
