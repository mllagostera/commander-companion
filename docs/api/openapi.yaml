openapi: 3.1.0
info:
  title: Commander Companion API
  version: 0.1.0
  description: API para la aplicación Commander Companion.
servers:
  - url: http://localhost:8080/api/v1
    description: Servidor de desarrollo
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    GoogleLoginRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          description: id_token emitido por Google Identity Services en el cliente.
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Segundos hasta que expira el access_token.
        user:
          $ref: '#/components/schemas/User'
    Deck:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        commander:
          type: string
        moxfield_id:
          type: string
          nullable: true
    Game:
      type: object
      properties:
        id:
          type: string
          format: uuid
        playgroup_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [pending, active, finished]
        started_at:
          type: string
          format: date-time
          nullable: true
    GamePlayer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        game_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        deck_id:
          type: string
          format: uuid
        life_total:
          type: integer
        poison_counters:
          type: integer
        energy_counters:
          type: integer
        experience_counters:
          type: integer
        is_eliminated:
          type: boolean
    GameAction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        game_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        target_id:
          type: string
          format: uuid
          nullable: true
        action_type:
          type: string
        payload:
          type: object
        created_at:
          type: string
          format: date-time
    Playgroup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      summary: Registrar usuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Username o email ya registrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      summary: Iniciar sesión con email y password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Credenciales inválidas, o la cuenta usa Google sign-in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/google:
    post:
      summary: Iniciar sesión (o registrarse) con Google
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: Login exitoso; se crea la cuenta o se vincula a una existente si hace falta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: id_token faltante, inválido o con email no verificado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Google sign-in no está configurado en el servidor (falta GOOGLE_CLIENT_ID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/refresh:
    post:
      summary: Refrescar token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token renovado (el refresh token anterior queda revocado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Refresh token inválido, expirado o ya revocado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      summary: Cerrar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Sesión terminada (revoca el refresh token indicado)
  /auth/me:
    get:
      summary: Obtener perfil actual
      responses:
        '200':
          description: Datos del usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{id}:
    get:
      summary: Obtener usuario
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle del usuario
    patch:
      summary: Actualizar usuario
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Usuario actualizado

  /playgroups:
    get:
      summary: Listar grupos de juego
      responses:
        '200':
          description: Lista de grupos
    post:
      summary: Crear grupo
      responses:
        '201':
          description: Grupo creado
  /playgroups/{id}:
    get:
      summary: Obtener grupo
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle del grupo

  /decks:
    get:
      summary: Listar decks
      responses:
        '200':
          description: Lista de decks
    post:
      summary: Crear deck manualmente
      responses:
        '201':
          description: Deck creado
  /decks/import/moxfield:
    post:
      summary: Importar desde Moxfield
      responses:
        '201':
          description: Deck importado
  /decks/{id}:
    get:
      summary: Obtener deck
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle del deck
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
    patch:
      summary: Modificar deck
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deck actualizado
    delete:
      summary: Eliminar deck
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deck eliminado

  /games:
    get:
      summary: Listar partidas
      responses:
        '200':
          description: Historial de partidas
    post:
      summary: Crear partida
      responses:
        '201':
          description: Partida creada (estado pending)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
  /games/{id}/join:
    post:
      summary: Unirse a la partida
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Jugador añadido
  /games/{id}/leave:
    post:
      summary: Salir de la partida (solo en pending)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Jugador removido
  /games/{id}/start:
    post:
      summary: Iniciar partida
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Partida activa
  /games/{id}/finish:
    post:
      summary: Finalizar partida
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Partida finalizada (lanza recálculo de estadísticas)
  /games/{id}/actions:
    post:
      summary: Registrar acción en la partida
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actor_id:
                  type: string
                target_id:
                  type: string
                action_type:
                  type: string
                payload:
                  type: object
      responses:
        '201':
          description: Acción registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameAction'
  /games/{id}/timeline:
    get:
      summary: Obtener historial completo de acciones
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Línea de tiempo de la partida

  /statistics/user:
    get:
      summary: Obtener estadísticas globales del usuario
      responses:
        '200':
          description: Estadísticas pre-calculadas del usuario
  /statistics/deck/{id}:
    get:
      summary: Obtener estadísticas de un deck
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estadísticas pre-calculadas del deck
  /statistics/playgroup/{id}:
    get:
      summary: Obtener estadísticas de un grupo
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estadísticas del grupo

  /sync/moxfield:
    post:
      summary: Iniciar sincronización con Moxfield
      responses:
        '202':
          description: Sincronización en proceso
  /sync/status:
    get:
      summary: Obtener estado de la sincronización
      responses:
        '200':
          description: Estado actual
