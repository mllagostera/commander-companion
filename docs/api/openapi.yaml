openapi: 3.1.0
info:
  title: Commander Companion API
  version: 0.1.0
  description: API para la aplicación Commander Companion.
servers:
  - url: http://localhost:8080/api/v1
    description: Servidor de desarrollo
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CursorParam:
      in: query
      name: cursor
      required: false
      description: >-
        Cursor opaco devuelto como `next_cursor` por la página anterior. Se
        devuelve tal cual, sin interpretarlo. Omitirlo pide la primera página.
      schema:
        type: string
    LimitParam:
      in: query
      name: limit
      required: false
      description: >-
        Cantidad máxima de elementos por página. Por encima del máximo se recorta
        en silencio.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        moxfield_username:
          type: string
          nullable: true
    UserSearchResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
      description: >-
        A diferencia de User, deliberadamente sin email: esto se muestra sobre
        resultados de OTROS usuarios (ver GET /users/search).
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    UpdateProfileRequest:
      type: object
      properties:
        moxfield_username:
          type: string
          description: Username de Moxfield a vincular al perfil (sin validar contra Moxfield).
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Token de verificación recibido por mail (query param `token` del link).
    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    GoogleLoginRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          description: id_token emitido por Google Identity Services en el cliente.
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Segundos hasta que expira el access_token.
        user:
          $ref: '#/components/schemas/User'
    Deck:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        commander:
          type: string
        moxfield_id:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
          description: >-
            Art crop de la carta principal del deck (normalmente el
            comandante), tomado de Moxfield en el import/resync.
    DeckListResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Deck'
        next_cursor:
          type: string
          nullable: true
          description: >-
            Cursor a pasar como query param `cursor` para pedir la página
            siguiente. Es null en la última página.
    CreateDeckRequest:
      type: object
      required: [name, commander]
      properties:
        name:
          type: string
        commander:
          type: string
        moxfield_id:
          type: string
        image_url:
          type: string
    SyncRequest:
      type: object
      required: [moxfield_id]
      properties:
        moxfield_id:
          type: string
          description: ID público del deck en Moxfield, o su URL completa.
    SyncResponse:
      type: object
      required: [status, deck, last_synced_at]
      properties:
        status:
          type: string
          enum: [updated, unchanged, synced, never_synced]
          description: >-
            En POST /sync/moxfield: `updated` si Moxfield traía cambios,
            `unchanged` si no. En GET /sync/status: `synced` si el deck tiene un
            sync previo registrado, `never_synced` si se importó y nunca se
            re-sincronizó.
        deck:
          $ref: '#/components/schemas/Deck'
        last_synced_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Momento del último sync exitoso. Es null solo cuando el deck se
            importó y nunca se re-sincronizó.
    MoxfieldImportJob:
      type: object
      required: [id, moxfield_username, status, imported_count, failed_count]
      properties:
        id:
          type: string
          format: uuid
        moxfield_username:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed, failed]
        total_decks:
          type: integer
          nullable: true
          description: Cantidad de decks públicos encontrados para este username. Null hasta resolverse.
        imported_count:
          type: integer
        failed_count:
          type: integer
        error_message:
          type: string
          nullable: true
    ImportMoxfieldRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: URL completa del deck en Moxfield (https://moxfield.com/decks/{id}) o solo el ID público.
    Game:
      type: object
      properties:
        id:
          type: string
          format: uuid
        playgroup_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [pending, active, finished]
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        current_turn_player_id:
          type: string
          format: uuid
          nullable: true
          description: De quién es el turno ahora (game_players.id). Null hasta el primer TurnStart.
        players:
          type: array
          items:
            $ref: '#/components/schemas/GamePlayer'
    GameListResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Game'
        next_cursor:
          type: string
          nullable: true
          description: >-
            Cursor a pasar como query param `cursor` para pedir la página
            siguiente. Es null en la última página.
    CreateGameRequest:
      type: object
      properties:
        playgroup_id:
          type: string
          format: uuid
          description: Opcional; asocia la partida a un grupo de juego existente.
    JoinGameRequest:
      type: object
      required: [deck_id]
      properties:
        deck_id:
          type: string
          format: uuid
          description: >-
            Debe pertenecer al usuario que se sienta (el autenticado, o
            user_id si se indica).
        user_id:
          type: string
          format: uuid
          description: >-
            Opcional. Proxy-join (ver ADR-0013): el usuario autenticado une a
            OTRO usuario en su nombre. Solo permitido si la partida tiene
            playgroup_id y ambos son miembros de ese mismo grupo; en ese caso
            deck_id debe pertenecer a user_id, no al caller. Omitido (o igual
            al usuario autenticado), es un join normal — sin cambios de
            comportamiento.
    GamePlayer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        game_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        deck_id:
          type: string
          format: uuid
        life_total:
          type: integer
        poison_counters:
          type: integer
        energy_counters:
          type: integer
        experience_counters:
          type: integer
        is_eliminated:
          type: boolean
    GameAction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        game_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        target_id:
          type: string
          format: uuid
          nullable: true
        action_type:
          type: string
        payload:
          type: object
        created_at:
          type: string
          format: date-time
    Playgroup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/PlaygroupMember'
    PlaygroupMember:
      type: object
      properties:
        playgroup_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        username:
          type: string
    CreatePlaygroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
    UpdatePlaygroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
    AddMemberRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid
          description: Debe ser un usuario existente; quien invita debe ya ser miembro del grupo.
    UserStatsResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        games_played:
          type: integer
        games_won:
          type: integer
        total_damage_dealt:
          type: integer
        total_commander_damage_dealt:
          type: integer
        total_eliminations:
          type: integer
    DeckStatsResponse:
      type: object
      properties:
        deck_id:
          type: string
          format: uuid
        games_played:
          type: integer
        games_won:
          type: integer
        highest_life_total_achieved:
          type: integer
        total_commander_damage_dealt:
          type: integer
    PlaygroupStatsResponse:
      type: object
      properties:
        playgroup_id:
          type: string
          format: uuid
        games_played:
          type: integer
          description: Partidas finalizadas asociadas a este grupo.
        members:
          type: array
          items:
            $ref: '#/components/schemas/PlaygroupMemberStats'
    PlaygroupMemberStats:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        games_played:
          type: integer
        games_won:
          type: integer
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      summary: Registrar usuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Username o email ya registrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Demasiadas peticiones de autenticación desde esta IP (rate limit por IP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/verify-email:
    post:
      summary: Confirmar la cuenta a partir del token de verificación mandado por mail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '204':
          description: Email verificado
        '400':
          description: Token inválido, ya usado o vencido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Demasiadas peticiones de autenticación desde esta IP (rate limit por IP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/resend-verification:
    post:
      summary: Reenviar el mail de verificación de cuenta
      description: >-
        Siempre responde 204, exista o no el email, y esté o no ya verificado (no revela
        nada, mismo criterio anti-enumeración que /auth/login).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '204':
          description: Solicitud aceptada (no implica que se haya mandado un mail nuevo)
        '429':
          description: Demasiadas peticiones de autenticación desde esta IP (rate limit por IP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      summary: Iniciar sesión con email y password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Credenciales inválidas, o la cuenta usa Google sign-in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Credenciales correctas pero el email todavía no fue confirmado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Demasiadas peticiones de autenticación desde esta IP (rate limit por IP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/google:
    post:
      summary: Iniciar sesión (o registrarse) con Google
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: Login exitoso; se crea la cuenta o se vincula a una existente si hace falta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: id_token faltante, inválido o con email no verificado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Google sign-in no está configurado en el servidor (falta GOOGLE_CLIENT_ID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Demasiadas peticiones de autenticación desde esta IP (rate limit por IP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/refresh:
    post:
      summary: Refrescar token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token renovado (el refresh token anterior queda revocado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Refresh token inválido, expirado o ya revocado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Demasiadas peticiones de autenticación desde esta IP (rate limit por IP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      summary: Cerrar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Sesión terminada (revoca el refresh token indicado)
  /auth/me:
    get:
      summary: Obtener perfil actual
      responses:
        '200':
          description: Datos del usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/search:
    get:
      summary: Buscar usuarios por username (parcial) o email (exacto)
      description: >-
        Para invitar gente a un playgroup sin conocer su UUID (ver
        POST /playgroups/{id}/members). username matchea por substring,
        case-insensitive; email exige coincidencia exacta a propósito — una
        búsqueda parcial de email permitiría enumerar direcciones ajenas por
        prefijo. Los resultados nunca incluyen el propio usuario autenticado
        ni el email de nadie (ver UserSearchResult), y se acotan a 10.
      parameters:
        - in: query
          name: q
          required: true
          description: Al menos 2 caracteres.
          schema:
            type: string
            minLength: 2
      responses:
        '200':
          description: Usuarios que matchean (hasta 10), sin el propio usuario autenticado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSearchResult'
        '400':
          description: q ausente o menor a 2 caracteres
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{id}:
    patch:
      summary: Actualizar el perfil propio (hoy, solo moxfield_username)
      description: >-
        id debe ser el propio usuario autenticado (vía JWT) — 404 en cualquier otro
        caso, sin distinguir "no existe" de "no es tuyo".
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Body inválido
        '404':
          description: id no es el del usuario autenticado

  /users/{id}/password:
    post:
      summary: Cambiar el password propio, tras validar el actual
      description: >-
        id debe ser el propio usuario autenticado (vía JWT) — 404 en cualquier otro
        caso, mismo criterio que PATCH /users/{id}. Las cuentas de Google (sin
        password) no pueden usar este endpoint.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password actualizado
        '400':
          description: Body inválido o new_password menor a 8 caracteres
        '401':
          description: current_password incorrecto, o la cuenta no tiene password (es de Google)
        '404':
          description: id no es el del usuario autenticado

  /playgroups:
    get:
      summary: Listar los grupos de juego del usuario autenticado
      responses:
        '200':
          description: Grupos de los que el usuario autenticado es miembro
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Playgroup'
    post:
      summary: Crear grupo (el creador queda como primer miembro)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaygroupRequest'
      responses:
        '201':
          description: Grupo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playgroup'
        '400':
          description: Falta el nombre del grupo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /playgroups/{id}:
    get:
      summary: Obtener grupo
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle del grupo, si el usuario autenticado es miembro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playgroup'
        '404':
          description: No existe, o el usuario autenticado no es miembro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Renombrar el grupo (solo un miembro existente puede editarlo)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlaygroupRequest'
      responses:
        '200':
          description: Grupo renombrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playgroup'
        '400':
          description: Falta el nombre nuevo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe, o el usuario autenticado no es miembro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /playgroups/{id}/members:
    post:
      summary: Añadir un miembro al grupo (solo un miembro existente puede invitar)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: Miembro añadido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaygroupMember'
        '404':
          description: Grupo o usuario a añadir no encontrados (o quien invita no es miembro del grupo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: El usuario ya es miembro del grupo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /playgroups/{id}/members/{userId}/decks:
    get:
      summary: Listar los decks de un miembro del grupo
      description: >-
        Permite ver los decks de OTRO miembro del mismo grupo (ver ADR-0013) —
        es lo que habilita elegir su deck en un proxy-join
        (`JoinGameRequest.user_id`). Autorización: el usuario autenticado y
        userId deben ser ambos miembros de este playgroup.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Decks del miembro indicado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deck'
        '404':
          description: >-
            Grupo inexistente, o el usuario autenticado no es miembro, o
            userId no es miembro de este grupo (no se distingue cuál)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /decks:
    get:
      summary: Listar decks
      description: >-
        Devuelve una página de los decks del usuario autenticado, del más reciente
        al más viejo. La paginación es cursor-based (keyset sobre created_at + id):
        se sigue `next_cursor` hasta que venga null.
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Página de decks del usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckListResponse'
        '400':
          description: cursor o limit inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Crear deck manualmente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeckRequest'
      responses:
        '201':
          description: Deck creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
  /decks/import/moxfield:
    post:
      summary: Importar desde Moxfield
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportMoxfieldRequest'
      responses:
        '201':
          description: Deck importado (nombre y comandante tomados de Moxfield)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
        '400':
          description: URL/ID inválido, o el deck de Moxfield no tiene comandante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe ningún deck público de Moxfield con ese ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /decks/{id}:
    get:
      summary: Obtener deck
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle del deck
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
        '404':
          description: No existe, o no pertenece al usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Eliminar deck
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deck eliminado
        '404':
          description: No existe, o no pertenece al usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /games:
    get:
      summary: Listar partidas
      description: >-
        Devuelve una página del historial de partidas, de la más reciente a la más
        vieja. La paginación es cursor-based (keyset sobre created_at + id): se
        sigue `next_cursor` hasta que venga null. Con `playgroup_id`, en cambio,
        devuelve el historial completo (sin paginar, `next_cursor` siempre null)
        de ese grupo — requiere que el usuario autenticado sea miembro.
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - in: query
          name: playgroup_id
          required: false
          schema:
            type: string
            format: uuid
          description: >-
            Si se indica, ignora cursor/limit y devuelve el historial completo del
            grupo. 404 si no existe o el usuario autenticado no es miembro.
      responses:
        '200':
          description: Página del historial de partidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameListResponse'
        '400':
          description: cursor o limit inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Crear partida
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameRequest'
      responses:
        '201':
          description: Partida creada (estado pending)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: playgroup_id inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /games/{id}:
    get:
      summary: Obtener partida
      description: Incluye el estado actual de sus jugadores (players).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle de la partida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '404':
          description: No existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /games/{id}/join:
    post:
      summary: Unirse a la partida con un deck propio, o unir a otro (proxy-join)
      description: >-
        Sin user_id (o igual al autenticado): join normal, sin cambios. Con
        user_id distinto: proxy-join (ver ADR-0013) — el caller une a otro
        usuario en su nombre, solo si ambos comparten el playgroup de la
        partida; el jugador queda con added_by = caller, autorizándolo a
        registrar acciones por ese asiento.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinGameRequest'
      responses:
        '200':
          description: Jugador añadido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamePlayer'
        '400':
          description: >-
            deck_id/user_id inválidos, o se intentó un proxy-join en una
            partida sin playgroup_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >-
            Proxy-join sin membresía compartida: el caller o user_id no
            pertenecen al playgroup de la partida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Partida o deck no encontrados (o el deck no pertenece a quien se sienta)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La partida ya no acepta jugadores, o ese usuario ya está en la partida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /games/{id}/leave:
    post:
      summary: Salir de la partida (solo en pending)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Jugador removido
        '404':
          description: El usuario autenticado no es miembro de esta partida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La partida ya no está en pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /games/{id}/start:
    post:
      summary: Iniciar partida
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Partida activa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '409':
          description: La partida no está en pending, o no tiene suficientes jugadores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /games/{id}/finish:
    post:
      summary: Finalizar partida
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Partida finalizada (lanza recálculo de estadísticas)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '409':
          description: Solo una partida activa puede finalizarse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /games/{id}/actions:
    post:
      summary: Registrar acción en la partida
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor_id, action_type]
              properties:
                actor_id:
                  type: string
                  format: uuid
                  description: ID del GamePlayer (no del usuario) que origina la acción.
                target_id:
                  type: string
                  format: uuid
                  description: ID del GamePlayer afectado; si se omite, afecta al propio actor.
                action_type:
                  type: string
                  enum: [LifeChange, CombatDamage, CommanderDamage, PoisonCounter, TurnStart, TurnEnd, Elimination]
                payload:
                  type: object
                  description: 'Para LifeChange/CombatDamage/CommanderDamage/PoisonCounter: { "amount": <integer> }.'
      responses:
        '400':
          description: action_type inválido, o payload.amount faltante/no numérico
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >-
            El usuario autenticado no es dueño del GamePlayer actor_id ni
            quien lo unió como proxy (ver ADR-0013)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Partida, actor o target no encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La partida no está activa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Acción registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameAction'
  /games/{id}/timeline:
    get:
      summary: Obtener historial completo de acciones
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Línea de tiempo de la partida

  /statistics/user:
    get:
      summary: Obtener estadísticas globales del usuario autenticado
      responses:
        '200':
          description: Estadísticas del usuario, recalculadas al finalizar cada partida (ceros si nunca jugó)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatsResponse'
  /statistics/deck/{id}:
    get:
      summary: Obtener estadísticas de un deck del usuario autenticado
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estadísticas del deck (ceros si nunca jugó una partida finalizada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckStatsResponse'
        '404':
          description: No existe, o no pertenece al usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /statistics/playgroup/{id}:
    get:
      summary: Obtener estadísticas de un grupo
      description: Calculadas en vivo sobre las partidas finalizadas del grupo (no hay tabla de resumen precalculada).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estadísticas agregadas por miembro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaygroupStatsResponse'

  /sync/moxfield:
    post:
      summary: Re-sincronizar un deck ya importado con Moxfield
      description: >-
        Vuelve a consultar Moxfield para un deck que el usuario YA importó y
        actualiza su nombre y comandante si cambiaron. Es la contraparte de
        `/decks/import/moxfield`, que crea un deck nuevo.


        La operación es síncrona: responde 200 con el resultado ya aplicado, no
        202 con un job. No existe un modelo de jobs en background (ver
        `internal/sync/service.go`), por eso tampoco hay `job_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        '200':
          description: Sincronización aplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '400':
          description: moxfield_id faltante o mal formado, o el deck de Moxfield ya no tiene comandante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >-
            El usuario autenticado no tiene importado ningún deck con ese
            moxfield_id, o el deck ya no existe en Moxfield
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sync/status:
    get:
      summary: Obtener el estado de sincronización de un deck
      description: >-
        Devuelve el estado guardado del deck importado, sin llamar a Moxfield:
        cómo está guardado ahora y cuándo fue su último sync.
      parameters:
        - in: query
          name: moxfield_id
          required: true
          description: ID público del deck en Moxfield (o su URL completa).
          schema:
            type: string
      responses:
        '200':
          description: Estado de sincronización del deck
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '400':
          description: moxfield_id faltante o mal formado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El usuario autenticado no tiene importado ningún deck con ese moxfield_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /moxfield-import:
    post:
      summary: Importar en background todos los decks públicos del username de Moxfield vinculado al perfil
      description: >-
        Contraparte masiva y asíncrona de `/decks/import/moxfield` (un deck
        puntual, síncrono). La lista de decks se resuelve de forma síncrona
        antes de crear el job: si Moxfield todavía no puede listarlos (ver
        `internal/moxfieldimport`), responde 501 en el momento, sin crear
        ningún job.
      responses:
        '202':
          description: Job creado, import en curso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoxfieldImportJob'
        '400':
          description: El usuario no tiene un username de Moxfield vinculado al perfil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ya hay un import pending/in_progress para este usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Listar los decks de un username de Moxfield todavía no está implementado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /moxfield-import/{jobId}:
    get:
      summary: Consultar el progreso de un job de import masivo
      description: Acotado al usuario autenticado -- 404 si el job no es suyo, sin distinguir de "no existe".
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estado del job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoxfieldImportJob'
        '404':
          description: El job no existe o no es del usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
