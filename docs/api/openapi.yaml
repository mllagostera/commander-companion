openapi: 3.1.0
info:
  title: Commander Companion API
  version: 0.1.0
  description: API for the Commander Companion application.
servers:
  - url: http://localhost:8080/api/v1
    description: Development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CursorParam:
      in: query
      name: cursor
      required: false
      description: >-
        Opaque cursor returned as `next_cursor` by the previous page. It is
        returned as-is, without interpreting it. Omitting it requests the first page.
      schema:
        type: string
    LimitParam:
      in: query
      name: limit
      required: false
      description: >-
        Maximum number of items per page. Above the maximum it is silently
        clamped.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        moxfield_username:
          type: string
          nullable: true
        has_password:
          type: boolean
          description: >-
            false = account created via Google Sign-In, with no password of its
            own. Clients use this to decide whether to show the change password
            flow (POST /users/{id}/password rejects it for these accounts).
    UserSearchResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
      description: >-
        Unlike User, deliberately without email: this is shown for results
        about OTHER users (see GET /users/search).
    UsernameAvailabilityResponse:
      type: object
      properties:
        available:
          type: boolean
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    UpdateProfileRequest:
      type: object
      properties:
        username:
          type: string
          description: >-
            New login/profile username (different from the Moxfield one). If
            omitted, it is left unchanged. 409 if already in use by another account.
        moxfield_username:
          type: string
          description: Moxfield username to link to the profile (not validated against Moxfield).
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Verification token received by email (query param `token` from the link).
    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    GoogleLoginRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          description: id_token issued by Google Identity Services on the client.
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Seconds until the access_token expires.
        user:
          $ref: '#/components/schemas/User'
    Deck:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        commander:
          type: string
        moxfield_id:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
          description: >-
            Art crop of the deck's main card (usually the commander), taken
            from Moxfield during import/resync.
    DeckListResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Deck'
        next_cursor:
          type: string
          nullable: true
          description: >-
            Cursor to pass as the `cursor` query param to request the next
            page. It is null on the last page.
    CreateDeckRequest:
      type: object
      required: [name, commander]
      properties:
        name:
          type: string
        commander:
          type: string
        moxfield_id:
          type: string
        image_url:
          type: string
    SyncRequest:
      type: object
      required: [moxfield_id]
      properties:
        moxfield_id:
          type: string
          description: Public deck ID on Moxfield, or its full URL.
    SyncResponse:
      type: object
      required: [status, deck, last_synced_at]
      properties:
        status:
          type: string
          enum: [updated, unchanged, synced, never_synced]
          description: >-
            In POST /sync/moxfield: `updated` if Moxfield had changes,
            `unchanged` if not. In GET /sync/status: `synced` if the deck has a
            previously recorded sync, `never_synced` if it was imported and
            never re-synced.
        deck:
          $ref: '#/components/schemas/Deck'
        last_synced_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Time of the last successful sync. It is null only when the deck
            was imported and never re-synced.
    MoxfieldImportJob:
      type: object
      required: [id, moxfield_username, status, imported_count, failed_count]
      properties:
        id:
          type: string
          format: uuid
        moxfield_username:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed, failed]
        total_decks:
          type: integer
          nullable: true
          description: Number of public decks found for this username. Null until resolved.
        imported_count:
          type: integer
        failed_count:
          type: integer
        error_message:
          type: string
          nullable: true
    DeckResyncJob:
      type: object
      required: [id, status, total_decks, updated_count, failed_count]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [in_progress, completed, failed]
        total_decks:
          type: integer
          description: >-
            Number of the user's decks with moxfield_id that are going to be
            resynced. Known from job creation (unlike
            MoxfieldImportJob.total_decks, here there is no need to query
            Moxfield to know it).
        updated_count:
          type: integer
          description: Decks processed without error (with or without real changes on Moxfield).
        failed_count:
          type: integer
        error_message:
          type: string
          nullable: true
    ImportMoxfieldRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: Full deck URL on Moxfield (https://moxfield.com/decks/{id}) or just the public ID.
    Game:
      type: object
      properties:
        id:
          type: string
          format: uuid
        playgroup_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [pending, active, finished]
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        current_turn_player_id:
          type: string
          format: uuid
          nullable: true
          description: Whose turn it is now (game_players.id). Null until the first TurnStart.
        players:
          type: array
          items:
            $ref: '#/components/schemas/GamePlayer'
    GameListResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Game'
        next_cursor:
          type: string
          nullable: true
          description: >-
            Cursor to pass as the `cursor` query param to request the next
            page. It is null on the last page.
    CreateGameRequest:
      type: object
      properties:
        playgroup_id:
          type: string
          format: uuid
          description: Optional; associates the game with an existing playgroup.
    JoinGameRequest:
      type: object
      required: [deck_id]
      properties:
        deck_id:
          type: string
          format: uuid
          description: >-
            Must belong to the user who is sitting down (the authenticated
            one, or user_id if specified).
        user_id:
          type: string
          format: uuid
          description: >-
            Optional. Proxy-join (see ADR-0013): the authenticated user joins
            ANOTHER user on their behalf. Only allowed if the game has a
            playgroup_id and both are members of that same playgroup; in that
            case deck_id must belong to user_id, not the caller. If omitted
            (or equal to the authenticated user), it is a normal join — no
            change in behavior.
    GamePlayer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        game_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        deck_id:
          type: string
          format: uuid
        life_total:
          type: integer
        poison_counters:
          type: integer
        energy_counters:
          type: integer
        experience_counters:
          type: integer
        is_eliminated:
          type: boolean
    GameAction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        game_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        target_id:
          type: string
          format: uuid
          nullable: true
        action_type:
          type: string
        payload:
          type: object
        created_at:
          type: string
          format: date-time
    Playgroup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/PlaygroupMember'
    PlaygroupMember:
      type: object
      properties:
        playgroup_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        username:
          type: string
    CreatePlaygroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
    UpdatePlaygroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
    AddMemberRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid
          description: Must be an existing user; the one inviting must already be a member of the group.
    UserStatsResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        games_played:
          type: integer
        games_won:
          type: integer
        total_damage_dealt:
          type: integer
        total_commander_damage_dealt:
          type: integer
        total_eliminations:
          type: integer
    DeckStatsResponse:
      type: object
      properties:
        deck_id:
          type: string
          format: uuid
        games_played:
          type: integer
        games_won:
          type: integer
        highest_life_total_achieved:
          type: integer
        total_commander_damage_dealt:
          type: integer
    PlaygroupStatsResponse:
      type: object
      properties:
        playgroup_id:
          type: string
          format: uuid
        games_played:
          type: integer
          description: Finished games associated with this playgroup.
        members:
          type: array
          items:
            $ref: '#/components/schemas/PlaygroupMemberStats'
    PlaygroupMemberStats:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        games_played:
          type: integer
        games_won:
          type: integer
    PlaygroupGameCountResponse:
      type: object
      properties:
        playgroup_id:
          type: string
          format: uuid
        playgroup_name:
          type: string
        games_played:
          type: integer
          description: Finished games the authenticated user has played within this playgroup.
    OpponentStatsResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          description: The opponent's ID.
        username:
          type: string
        games_together:
          type: integer
        times_you_eliminated_them:
          type: integer
        times_eliminated_by_opponent:
          type: integer
    FinishedGameListResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FinishedGameResponse'
        next_cursor:
          type: string
          nullable: true
          description: Cursor to pass as the `cursor` query param to request the next page. It is null on the last page.
    FinishedGameResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        playgroup_id:
          type: string
          format: uuid
          nullable: true
        playgroup_name:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        players:
          type: array
          items:
            $ref: '#/components/schemas/FinishedGamePlayerResponse'
    FinishedGamePlayerResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        deck_id:
          type: string
          format: uuid
        deck_name:
          type: string
        deck_commander:
          type: string
        deck_image_url:
          type: string
          nullable: true
        won:
          type: boolean
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      summary: Register user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Username or email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many authentication requests from this IP (rate limit per IP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/username-available:
    get:
      summary: Check whether a username is free to register (or to rename to)
      description: >-
        Public/unauthenticated, unlike GET /users/search: used by the registration
        form to validate the username before submitting. Exact, case-sensitive match
        against the same uniqueness constraint the database enforces on username.
        Shares the same per-IP rate limit as the other public auth endpoints.
      security: []
      parameters:
        - in: query
          name: username
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Whether the username is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameAvailabilityResponse'
        '400':
          description: Missing or blank username
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many authentication requests from this IP (rate limit per IP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/verify-email:
    post:
      summary: Confirm the account using the verification token sent by email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '204':
          description: Email verified
        '400':
          description: Invalid, already used, or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many authentication requests from this IP (rate limit per IP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/resend-verification:
    post:
      summary: Resend the account verification email
      description: >-
        Always responds 204, whether or not the email exists, and whether or
        not it is already verified (reveals nothing, same anti-enumeration
        criteria as /auth/login).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '204':
          description: Request accepted (does not imply a new email was sent)
        '429':
          description: Too many authentication requests from this IP (rate limit per IP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials, or the account uses Google sign-in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Correct credentials but the email has not yet been confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many authentication requests from this IP (rate limit per IP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/google:
    post:
      summary: Log in (or register) with Google
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: Successful login; the account is created or linked to an existing one if needed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Missing or invalid id_token, or with an unverified email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Google sign-in is not configured on the server (missing GOOGLE_CLIENT_ID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many authentication requests from this IP (rate limit per IP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/refresh:
    post:
      summary: Refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token renewed (the previous refresh token is revoked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid, expired, or already revoked refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many authentication requests from this IP (rate limit per IP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      summary: Log out
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Session ended (revokes the specified refresh token)
  /auth/me:
    get:
      summary: Get current profile
      responses:
        '200':
          description: Authenticated user's data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/search:
    get:
      summary: Search users by username (partial) or email (exact)
      description: >-
        For inviting people to a playgroup without knowing their UUID (see
        POST /playgroups/{id}/members). username matches by substring,
        case-insensitive; email requires an exact match on purpose — a
        partial email search would allow enumerating other people's addresses
        by prefix. Results never include the authenticated user themselves
        nor anyone's email (see UserSearchResult), and are capped at 10.
      parameters:
        - in: query
          name: q
          required: true
          description: At least 2 characters.
          schema:
            type: string
            minLength: 2
      responses:
        '200':
          description: Matching users (up to 10), excluding the authenticated user themselves
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSearchResult'
        '400':
          description: q missing or shorter than 2 characters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many search requests from this IP (rate limit per IP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{id}:
    patch:
      summary: Update your own profile (username and/or moxfield_username)
      description: >-
        id must be the authenticated user themselves (via JWT) — 404 in any
        other case, without distinguishing "does not exist" from "is not yours".
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid body, or empty/whitespace-only username
        '404':
          description: id does not match the authenticated user
        '409':
          description: username already in use by another account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{id}/password:
    post:
      summary: Change your own password, after validating the current one
      description: >-
        id must be the authenticated user themselves (via JWT) — 404 in any
        other case, same criteria as PATCH /users/{id}. Google accounts
        (without a password) cannot use this endpoint.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password updated
        '400':
          description: Invalid body or new_password shorter than 8 characters
        '401':
          description: current_password incorrect, or the account has no password (it's a Google account)
        '404':
          description: id does not match the authenticated user

  /playgroups:
    get:
      summary: List the authenticated user's playgroups
      responses:
        '200':
          description: Playgroups the authenticated user is a member of
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Playgroup'
    post:
      summary: Create playgroup (the creator becomes its first member)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaygroupRequest'
      responses:
        '201':
          description: Playgroup created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playgroup'
        '400':
          description: Missing playgroup name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /playgroups/{id}:
    get:
      summary: Get playgroup
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Playgroup detail, if the authenticated user is a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playgroup'
        '404':
          description: Does not exist, or the authenticated user is not a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Rename the playgroup (only an existing member can edit it)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlaygroupRequest'
      responses:
        '200':
          description: Playgroup renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playgroup'
        '400':
          description: Missing new name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Does not exist, or the authenticated user is not a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /playgroups/{id}/members:
    post:
      summary: Add a member to the playgroup (only an existing member can invite)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaygroupMember'
        '404':
          description: Playgroup or user to add not found (or the inviter is not a member of the playgroup)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The user is already a member of the playgroup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /playgroups/{id}/members/{userId}/decks:
    get:
      summary: List a playgroup member's decks
      description: >-
        Allows viewing the decks of ANOTHER member of the same playgroup (see
        ADR-0013) — this is what enables choosing their deck in a proxy-join
        (`JoinGameRequest.user_id`). Authorization: both the authenticated
        user and userId must be members of this playgroup.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Decks of the specified member
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deck'
        '404':
          description: >-
            Playgroup does not exist, or the authenticated user is not a
            member, or userId is not a member of this playgroup (which one is
            not distinguished)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /decks:
    get:
      summary: List decks
      description: >-
        Returns a page of the authenticated user's decks, from most recent to
        oldest. Pagination is cursor-based (keyset over created_at + id):
        follow `next_cursor` until it comes back null.
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Page of the authenticated user's decks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckListResponse'
        '400':
          description: Invalid cursor or limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create deck manually
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeckRequest'
      responses:
        '201':
          description: Deck created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
  /decks/import/moxfield:
    post:
      summary: Import from Moxfield
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportMoxfieldRequest'
      responses:
        '201':
          description: Deck imported (name and commander taken from Moxfield)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
        '400':
          description: Invalid URL/ID, or the Moxfield deck has no commander
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No public Moxfield deck exists with that ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The authenticated user already has a deck imported from this Moxfield ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /decks/{id}:
    get:
      summary: Get deck
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deck detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
        '404':
          description: Does not exist, or does not belong to the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete deck
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deck deleted
        '404':
          description: Does not exist, or does not belong to the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /games:
    get:
      summary: List games
      description: >-
        Returns a page of the game history, from most recent to oldest.
        Pagination is cursor-based (keyset over created_at + id): follow
        `next_cursor` until it comes back null. With `playgroup_id`, however,
        it returns the full history (unpaginated, `next_cursor` always null)
        of that playgroup — requires the authenticated user to be a member.
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - in: query
          name: playgroup_id
          required: false
          schema:
            type: string
            format: uuid
          description: >-
            If specified, ignores cursor/limit and returns the full history
            of the playgroup. 404 if it does not exist or the authenticated
            user is not a member.
      responses:
        '200':
          description: Page of the game history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameListResponse'
        '400':
          description: Invalid cursor or limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create game
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameRequest'
      responses:
        '201':
          description: Game created (pending state)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: Invalid playgroup_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /games/{id}:
    get:
      summary: Get game
      description: Includes the current state of its players.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Game detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '404':
          description: Does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /games/{id}/join:
    post:
      summary: Join the game with your own deck, or add another player (proxy-join)
      description: >-
        Without user_id (or equal to the authenticated user): normal join, no
        changes. With a different user_id: proxy-join (see ADR-0013) — the
        caller adds another user on their behalf, only if both share the
        game's playgroup; the player ends up with added_by = caller,
        authorizing them to register actions for that seat.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinGameRequest'
      responses:
        '200':
          description: Player added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamePlayer'
        '400':
          description: >-
            Invalid deck_id/user_id, or a proxy-join was attempted on a game
            without playgroup_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >-
            Proxy-join without shared membership: the caller or user_id do
            not belong to the game's playgroup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Game or deck not found (or the deck does not belong to the person joining)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The game no longer accepts players, or that user is already in the game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /games/{id}/leave:
    post:
      summary: Leave the game (only while pending)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Player removed
        '404':
          description: The authenticated user is not a member of this game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The game is no longer pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /games/{id}/start:
    post:
      summary: Start game
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Active game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '409':
          description: The game is not pending, or does not have enough players
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /games/{id}/finish:
    post:
      summary: Finish game
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Game finished (triggers statistics recalculation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '409':
          description: Only an active game can be finished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /games/{id}/actions:
    post:
      summary: Register an action in the game
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor_id, action_type]
              properties:
                actor_id:
                  type: string
                  format: uuid
                  description: ID of the GamePlayer (not the user) that originates the action.
                target_id:
                  type: string
                  format: uuid
                  description: ID of the affected GamePlayer; if omitted, it affects the actor themselves.
                action_type:
                  type: string
                  enum: [LifeChange, CombatDamage, CommanderDamage, PoisonCounter, TurnStart, TurnEnd, Elimination]
                payload:
                  type: object
                  description: >-
                    For LifeChange/CombatDamage/CommanderDamage/PoisonCounter:
                    { "amount": <integer> }. Must be a whole number with
                    magnitude <= 1,000,000. For CombatDamage/CommanderDamage
                    it must additionally be strictly positive (it's a
                    quantity of damage, not a signed delta) — LifeChange and
                    PoisonCounter accept negative values (a signed delta,
                    e.g. to correct a misclick).
      responses:
        '400':
          description: >-
            Invalid action_type; missing, non-numeric, non-integer, or
            out-of-range payload.amount; or payload.amount isn't positive for
            CombatDamage/CommanderDamage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >-
            The authenticated user is neither the owner of the GamePlayer
            actor_id nor the one who added them as a proxy (see ADR-0013)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Game, actor, or target not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The game is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Action registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameAction'
  /games/{id}/timeline:
    get:
      summary: Get full action history
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Game timeline

  /statistics/user:
    get:
      summary: Get the authenticated user's overall statistics
      responses:
        '200':
          description: User statistics, recalculated when each game finishes (zeros if they never played)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatsResponse'
  /statistics/decks:
    get:
      summary: Get statistics for every deck of the authenticated user
      description: >-
        A single call replacing one GET /statistics/deck/{id} per deck --
        used by the web dashboard and the per-deck statistics page, which
        used to do that N+1.
      responses:
        '200':
          description: Statistics for every deck owned by the user (zeros for a deck never played), empty array if they own none
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeckStatsResponse'
  /statistics/deck/{id}:
    get:
      summary: Get statistics for a deck of the authenticated user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deck statistics (zeros if it never played a finished game)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckStatsResponse'
        '404':
          description: Does not exist, or does not belong to the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /statistics/playgroup/{id}:
    get:
      summary: Get statistics for a playgroup
      description: Calculated live over the playgroup's finished games (there is no precalculated summary table).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Statistics aggregated by member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaygroupStatsResponse'
  /statistics/playgroups:
    get:
      summary: Get how many finished games the authenticated user has played in each of their playgroups
      description: >-
        Every playgroup the user belongs to, with its games_played count, in
        a single call -- replaces doing one GET /statistics/playgroup/{id}
        per group just to find the one played the most.
      responses:
        '200':
          description: One entry per playgroup the user belongs to (games_played is 0 for one never played)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaygroupGameCountResponse'
  /statistics/opponents:
    get:
      summary: Get the authenticated user's head-to-head record against every opponent they've played
      description: >-
        Calculated live over every finished game the user has shared a seat
        in (there is no precalculated summary table), grouped by opponent.
        Feeds both "most played against" (max games_together) and "archenemy"
        (max times_eliminated_by_opponent) on the statistics screen.
      responses:
        '200':
          description: One entry per opponent the user has shared a finished game with, empty array if none yet
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpponentStatsResponse'
  /statistics/games:
    get:
      summary: Get a page of the authenticated user's finished-games history
      description: >-
        Unlike GET /games (kept lean for the dashboard/join-game flow), each
        entry is enriched with every seat's username and deck name/commander/
        image, resolved server-side in one batched round trip per page.
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: A page of finished games, most recent first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishedGameListResponse'

  /sync/moxfield:
    post:
      summary: Re-sync an already imported deck with Moxfield
      description: >-
        Queries Moxfield again for a deck the user has ALREADY imported and
        updates its name and commander if they changed. It is the counterpart
        to `/decks/import/moxfield`, which creates a new deck.


        The operation is synchronous: it responds 200 with the result already
        applied, not 202 with a job. There is no background job model (see
        `internal/sync/service.go`), which is also why there is no `job_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        '200':
          description: Sync applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '400':
          description: Missing or malformed moxfield_id, or the Moxfield deck no longer has a commander
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >-
            The authenticated user has no imported deck with that
            moxfield_id, or the deck no longer exists on Moxfield
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sync/status:
    get:
      summary: Get a deck's sync status
      description: >-
        Returns the saved state of the imported deck, without calling
        Moxfield: how it is currently stored and when its last sync was.
      parameters:
        - in: query
          name: moxfield_id
          required: true
          description: Public deck ID on Moxfield (or its full URL).
          schema:
            type: string
      responses:
        '200':
          description: Deck sync status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '400':
          description: Missing or malformed moxfield_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The authenticated user has no imported deck with that moxfield_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /moxfield-import:
    post:
      summary: Import in the background all public decks of the Moxfield username linked to the profile
      description: >-
        Bulk, asynchronous counterpart to `/decks/import/moxfield` (a single
        deck, synchronous). Returns as soon as the job row exists: listing the
        decks on Moxfield and importing them both happen afterwards, in the
        background. The job starts in `pending` (Moxfield hasn't been queried
        yet, `total_decks` is null) and moves to `in_progress` once the deck
        list is known; if listing itself fails, the job goes straight to
        `failed` with `error_message` set, instead of this request failing.
      responses:
        '202':
          description: Job created (status `pending`), import starting in the background
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoxfieldImportJob'
        '400':
          description: The user has no Moxfield username linked to the profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: There is already a pending/in_progress import for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: Check the authenticated user's most recently started bulk import job
      description: >-
        Whatever its status (pending/in_progress/completed/failed) -- lets a
        client that lost track of the job ID (e.g. the web settings page
        after navigating away and back) resume showing its progress without
        needing the ID.
      responses:
        '200':
          description: Latest job for the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoxfieldImportJob'
        '404':
          description: The user has never started a bulk import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /moxfield-import/{jobId}:
    get:
      summary: Check the progress of a bulk import job
      description: Scoped to the authenticated user -- 404 if the job is not theirs, without distinguishing from "does not exist".
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoxfieldImportJob'
        '404':
          description: The job does not exist or does not belong to the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /decks/resync-all:
    post:
      summary: Resync in the background all of the user's decks with moxfield_id
      description: >-
        Different from `/moxfield-import`: that one brings in NEW decks from
        a Moxfield username; this one updates the decks the user ALREADY HAS
        imported (name/commander/image), internally calling the same logic as
        `/sync/moxfield` for each one, spaced out so as not to hit the
        Moxfield API in parallel. The list is resolved synchronously before
        creating the job: with no eligible decks, it responds 400 immediately.
      responses:
        '202':
          description: Job created, resync in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckResyncJob'
        '400':
          description: The user has no deck with moxfield_id to resync
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: There is already a pending/in_progress resync for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /decks/resync-all/{jobId}:
    get:
      summary: Check the progress of a bulk deck resync job
      description: Scoped to the authenticated user -- 404 if the job is not theirs, without distinguishing from "does not exist".
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckResyncJob'
        '404':
          description: The job does not exist or does not belong to the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
