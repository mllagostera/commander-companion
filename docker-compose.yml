services:
  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=postgres://postgres:postgres@db:5432/commander?sslmode=disable
      - JWT_SECRET=dev-insecure-jwt-secret-change-me
      - ACCESS_TOKEN_TTL=15m
      - REFRESH_TOKEN_TTL=720h
      - GOOGLE_CLIENT_ID=908385413195-ktblog02ecjj78f8ghffamuid3iaj6cu.apps.googleusercontent.com
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      - WEB_APP_URL=http://localhost:3000
      # REQUIRE_EMAIL_VERIFICATION sin setear: default false (fase alpha, ver
      # ADR-0012) — el registro deja la cuenta verificada de entrada y no manda mail.
      # RESEND_API_KEY/EMAIL_FROM/RESEND_VERIFY_EMAIL_TEMPLATE_ID sin setear: el link de
      # verificación se loguea por consola en vez de mandarse (ver internal/email).
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=commander
    volumes:
      # Postgres 18+ espera un único mount en /var/lib/postgresql (no en
      # .../data): el propio entrypoint arma un subdirectorio versionado
      # adentro para dejar el terreno listo para pg_upgrade --link.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      # Alcanzable desde el navegador del host (llamadas hechas desde el cliente).
      - NUXT_PUBLIC_API_BASE=http://localhost:8080/api/v1
      # Alcanzable solo desde dentro de la red de Compose (llamadas SSR, ver
      # web/nuxt.config.ts). Sin esta variable, el render en servidor
      # intentaría resolver "localhost:8080" dentro del propio contenedor web.
      - NUXT_API_BASE=http://api:8080/api/v1
      - NUXT_PUBLIC_GOOGLE_CLIENT_ID=908385413195-ktblog02ecjj78f8ghffamuid3iaj6cu.apps.googleusercontent.com
    depends_on:
      - api

volumes:
  postgres_data:
