services:
  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=postgres://postgres:postgres@db:5432/commander?sslmode=disable
      - JWT_SECRET=dev-insecure-jwt-secret-change-me
      - ACCESS_TOKEN_TTL=15m
      - REFRESH_TOKEN_TTL=720h
      - GOOGLE_CLIENT_ID=908385413195-ktblog02ecjj78f8ghffamuid3iaj6cu.apps.googleusercontent.com
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      - WEB_APP_URL=http://localhost:3000
      # REQUIRE_EMAIL_VERIFICATION not set: default false (alpha phase, see
      # ADR-0012) — registration leaves the account verified from the start and doesn't send a mail.
      # RESEND_API_KEY/EMAIL_FROM/RESEND_VERIFY_EMAIL_TEMPLATE_ID not set: the verification
      # link is logged to the console instead of being sent (see internal/email).
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=commander
    volumes:
      # Postgres 18+ expects a single mount at /var/lib/postgresql (not at
      # .../data): the entrypoint itself creates a versioned subdirectory
      # inside it to leave the ground ready for pg_upgrade --link.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      # Reachable from the host's browser (calls made from the client).
      - NUXT_PUBLIC_API_BASE=http://localhost:8080/api/v1
      # Reachable only from within the Compose network (SSR calls, see
      # web/nuxt.config.ts). Without this variable, server-side rendering
      # would try to resolve "localhost:8080" inside the web container itself.
      - NUXT_API_BASE=http://api:8080/api/v1
      - NUXT_PUBLIC_GOOGLE_CLIENT_ID=908385413195-ktblog02ecjj78f8ghffamuid3iaj6cu.apps.googleusercontent.com
    depends_on:
      - api

volumes:
  postgres_data:
