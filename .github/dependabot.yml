version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
      # TypeScript 7 rewrote the compiler (native port) and no longer exposes
      # 'typescript/lib/tsc' in its package.json "exports". vue-tsc 3.3.8
      # depends on that path to hook into the compiler, and typecheck
      # breaks with ERR_PACKAGE_PATH_NOT_EXPORTED. Remove as soon as vue-tsc
      # publishes TS7 support (see PR #22, closed for this reason).
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # h3 is declared only for `import type { H3Event } from 'h3'` (server/, useNitroFetch).
      # At runtime Nuxt 4 serves through Nitro 2, which bundles its own h3 1.x,
      # so bumping ours to 2.x types our handlers against an API that never runs
      # and typecheck fails (TS2345: two incompatible H3Event types). Remove once
      # Nuxt ships on Nitro 3 / h3 2 (see PR #144, closed for this reason).
      - dependency-name: "h3"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
