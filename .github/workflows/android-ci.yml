name: Android CI

on:
  push:
    branches: [main]
  pull_request:

# On pull_request a new push cancels the branch's in-flight run, which is the
# usual CI-time saving. On push to main each commit gets its own group instead,
# so a merge landing seconds after another never cancels the earlier commit's
# run: a cancelled run reports neither success nor failure, which leaves that
# commit with no check result and blocks anything gated on CI passing.
concurrency:
  group: android-ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

defaults:
  run:
    working-directory: android

jobs:
  # No path filter on the workflow itself: it always runs and always reports a
  # check (even a "skipped" one), so it can be marked as required in branch
  # protection without leaving PRs that don't touch android/ hanging.
  changes:
    name: Detect changes in android/
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      android_workflow: ${{ steps.filter.outputs.android_workflow }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # 'every': a changed file counts toward the 'android' filter only if it
          # matches 'android/**' AND does NOT match any of the .md exclusions
          # (so a README-only change doesn't trigger lint/tests/assembleDebug).
          # The workflow file itself goes in a separate filter ('android_workflow')
          # because under 'every' it can't share a list with 'android/**' (they're
          # mutually exclusive patterns; see docs/roadmap/TASKS.md).
          predicate-quantifier: 'every'
          filters: |
            android:
              - 'android/**'
              - '!android/README.md'
              - '!android/**/*.md'
            android_workflow:
              - '.github/workflows/android-ci.yml'

  # Runs without Gradle, in seconds, and catches what a build can't: Android
  # falls back to the default locale, so a string missing from values-en shows
  # up in Spanish to an English user with nothing failing anywhere.
  i18n:
    name: string resources translated in every locale
    needs: changes
    if: needs.changes.outputs.android == 'true' || needs.changes.outputs.android_workflow == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - name: Check string resources
        run: node .github/scripts/check-i18n-android.mjs

  lint-test-build:
    name: lint, unit tests and assembleDebug
    needs: changes
    if: needs.changes.outputs.android == 'true' || needs.changes.outputs.android_workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Every runner starts empty, so without this Android Gradle mints a new random debug
      # key on each run: every CI APK would be signed differently (none installs over the
      # previous one) and Google Sign-In could never work, since OAuth registers a fixed SHA-1.
      # The secret is the same debug.keystore used for local builds, base64-encoded, so CI and
      # local APKs share one signature and one SHA-1. Restored before any Gradle task, so the
      # build finds it instead of generating its own. Without the secret (Dependabot, forks)
      # the build still runs, on a throwaway key, and says so.
      - name: Restore the shared debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 secret not set: this APK is signed with a throwaway debug key"
          else
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            # Public fingerprint, logged so it can be checked against the one in Google Cloud.
            keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | grep 'SHA1:'
          fi

      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # The APK archived below is meant to be installed on a real phone, so it talks to the
      # deployed backend, whose URL comes from the API_BASE_URL repository secret. Local builds
      # keep android/gradle.properties' 10.0.2.2 (the emulator's alias for the machine running the
      # backend); lint and tests don't care which. Without the secret -- Dependabot and fork PRs
      # get no secrets -- the build still runs, on the local default, and says so.
      - name: Build (assembleDebug)
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::warning::API_BASE_URL secret not set: this APK points at 10.0.2.2, not the deployed backend"
            ./gradlew assembleDebug --stacktrace
          else
            # Retrofit needs the base URL to end with a slash.
            case "$API_BASE_URL" in */) ;; *) API_BASE_URL="$API_BASE_URL/" ;; esac
            ./gradlew assembleDebug --stacktrace -PAPI_BASE_URL="$API_BASE_URL"
          fi

      # Kept out of the report bundle below (which runs with if: always()) on purpose:
      # this one should only run when assembleDebug succeeded, so if-no-files-found:error
      # flags a moved output path instead of silently uploading nothing.
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Lint/Test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/test-results/**/*.xml
          retention-days: 14
