name: Android CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  # Sin filtro de path: siempre corre y siempre reporta un check (aunque sea
  # "skipped"), para que este workflow pueda marcarse como required en
  # branch protection sin dejar colgados los PRs que no tocan android/.
  changes:
    name: Detectar cambios en android/
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      android_workflow: ${{ steps.filter.outputs.android_workflow }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # 'every': a changed file counts toward the 'android' filter only if it
          # matches 'android/**' AND does NOT match any of the .md exclusions
          # (so a README-only change doesn't trigger lint/tests/assembleDebug).
          # The workflow file itself goes in a separate filter ('android_workflow')
          # because under 'every' it can't share a list with 'android/**' (they're
          # mutually exclusive patterns; see docs/roadmap/TASKS.md).
          predicate-quantifier: 'every'
          filters: |
            android:
              - 'android/**'
              - '!android/README.md'
              - '!android/**/*.md'
            android_workflow:
              - '.github/workflows/android-ci.yml'

  lint-test-build:
    name: lint, unit tests y assembleDebug
    needs: changes
    if: needs.changes.outputs.android == 'true' || needs.changes.outputs.android_workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Tests unitarios
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Publicar reportes de Lint/Test
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/test-results/**/*.xml
          retention-days: 14
