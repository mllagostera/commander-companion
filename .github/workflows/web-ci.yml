name: Web CI

on:
  push:
    branches: [main]
  pull_request:

# On pull_request a new push cancels the branch's in-flight run, which is the
# usual CI-time saving. On push to main each commit gets its own group instead,
# so a merge landing seconds after another never cancels the earlier commit's
# run: a cancelled run reports neither success nor failure, which leaves that
# commit with no check result and blocks anything gated on CI passing.
concurrency:
  group: web-ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

defaults:
  run:
    working-directory: web

jobs:
  # Sin filtro de path: siempre corre y siempre reporta un check (aunque sea
  # "skipped"), para que este workflow pueda marcarse como required en
  # branch protection sin dejar colgados los PRs que no tocan web/.
  changes:
    name: Detectar cambios en web/
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      web_workflow: ${{ steps.filter.outputs.web_workflow }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # 'every': a changed file counts toward the 'web' filter only if it
          # matches 'web/**' AND does NOT match any of the .md exclusions
          # (so a README-only change doesn't trigger eslint/typecheck/nuxt build).
          # The workflow file itself goes in a separate filter ('web_workflow')
          # because under 'every' it can't share a list with 'web/**' (they're
          # mutually exclusive patterns; see docs/roadmap/TASKS.md).
          predicate-quantifier: 'every'
          filters: |
            web:
              - 'web/**'
              - '!web/README.md'
              - '!web/**/*.md'
            web_workflow:
              - '.github/workflows/web-ci.yml'

  lint-typecheck-build:
    name: eslint, typecheck y nuxt build
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.web_workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        run: npm run lint -- --max-warnings=0

      - name: Typecheck (vue-tsc)
        run: npm run typecheck

      - name: Build SSR (nuxt build)
        run: npm run build

  dockerfile-lint:
    name: hadolint (Dockerfile)
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.web_workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: web/Dockerfile
