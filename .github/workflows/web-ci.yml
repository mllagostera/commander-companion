name: Web CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  # Sin filtro de path: siempre corre y siempre reporta un check (aunque sea
  # "skipped"), para que este workflow pueda marcarse como required en
  # branch protection sin dejar colgados los PRs que no tocan web/.
  changes:
    name: Detectar cambios en web/
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      web_workflow: ${{ steps.filter.outputs.web_workflow }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # 'every': un archivo cambiado cuenta para el filtro 'web' solo si
          # matchea 'web/**' Y NO matchea ninguna de las exclusiones de .md
          # (así un README-only change no dispara eslint/typecheck/nuxt build).
          # El propio workflow file va en un filtro aparte ('web_workflow')
          # porque bajo 'every' no puede compartir lista con 'web/**' (son
          # rutas mutuamente excluyentes; ver docs/roadmap/TASKS.md).
          predicate-quantifier: 'every'
          filters: |
            web:
              - 'web/**'
              - '!web/README.md'
              - '!web/**/*.md'
            web_workflow:
              - '.github/workflows/web-ci.yml'

  lint-typecheck-build:
    name: eslint, typecheck y nuxt build
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.web_workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        run: npm run lint -- --max-warnings=0

      - name: Typecheck (vue-tsc)
        run: npm run typecheck

      - name: Build SSR (nuxt build)
        run: npm run build

  dockerfile-lint:
    name: hadolint (Dockerfile)
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.web_workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: web/Dockerfile
