name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  # Job with no path filter: always runs and always reports a check, even if
  # it's "skipped". This lets the checks below be marked as required in
  # branch protection without leaving PRs that don't touch backend/ blocked
  # (a required check that never fires leaves the PR hanging).
  changes:
    name: Detectar cambios en backend/
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      backend_workflow: ${{ steps.filter.outputs.backend_workflow }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # 'every': a changed file counts toward the 'backend' filter only if it
          # matches 'backend/**' AND does NOT match any of the .md exclusions
          # (so a README-only change doesn't trigger build+test+lint+Postgres).
          # The workflow file itself goes in a separate filter ('backend_workflow')
          # because under 'every' it can't share a list with 'backend/**' (they're
          # mutually exclusive patterns; see docs/roadmap/TASKS.md).
          predicate-quantifier: 'every'
          filters: |
            backend:
              - 'backend/**'
              - '!backend/README.md'
              - '!backend/**/*.md'
            backend_workflow:
              - '.github/workflows/backend-ci.yml'

  fmt-vet:
    name: gofmt / go vet
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.backend_workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
      - name: gofmt (fails on unformatted files)
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "Los siguientes archivos no están formateados con gofmt:"
            echo "$fmt_out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...

  lint:
    name: golangci-lint
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.backend_workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: backend
          args: --timeout=5m

  sqlc-diff:
    name: sqlc generate (sin diffs pendientes)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.backend_workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.27.0"
      - name: sqlc generate
        run: sqlc generate
      - name: Verificar que el código generado está actualizado
        run: |
          if ! git diff --quiet -- internal; then
            echo "El código generado por sqlc no coincide con los query.sql / migraciones."
            echo "Corre 'make generate-sql' localmente y commitea el resultado."
            git diff -- internal
            exit 1
          fi

  build-test-migrate:
    name: build, test y migraciones contra PostgreSQL
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.backend_workflow == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: commander_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: postgres://postgres:postgres@localhost:5432/commander_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
      - name: go build
        run: go build ./...
      - name: Instalar goose
        # Pinned version (not @latest): v3.27.0 is the latest one compatible with the Go
        # version pinned by backend/go.mod (1.25.0). v3.27.3 requires go >=1.25.7 and breaks this
        # step with @latest.
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.27.0
      - name: Aplicar migraciones
        run: goose -dir migrations postgres "$DB_URL" up
      - name: go test
        # -p 1: the integration tests (auth, decks) share a single Postgres
        # database and TRUNCATE tables common to several tests; running the
        # test binaries of different packages in parallel (the `go test` default)
        # would make them step on each other.
        run: go test -race -cover -p 1 ./...

  dockerfile-lint:
    name: hadolint (Dockerfile)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.backend_workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: backend/Dockerfile
