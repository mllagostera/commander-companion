name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  # Job sin filtro de path: siempre corre y siempre reporta un check, aunque
  # sea "skipped". Así los checks de abajo pueden marcarse como required en
  # branch protection sin dejar bloqueados los PRs que no tocan backend/
  # (un check requerido que nunca llega a dispararse deja el PR colgado).
  changes:
    name: Detectar cambios en backend/
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      backend_workflow: ${{ steps.filter.outputs.backend_workflow }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # 'every': un archivo cambiado cuenta para el filtro 'backend' solo si
          # matchea 'backend/**' Y NO matchea ninguna de las exclusiones de .md
          # (así un README-only change no dispara build+test+lint+Postgres).
          # El propio workflow file va en un filtro aparte ('backend_workflow')
          # porque bajo 'every' no puede compartir lista con 'backend/**' (son
          # rutas mutuamente excluyentes; ver docs/roadmap/TASKS.md).
          predicate-quantifier: 'every'
          filters: |
            backend:
              - 'backend/**'
              - '!backend/README.md'
              - '!backend/**/*.md'
            backend_workflow:
              - '.github/workflows/backend-ci.yml'

  fmt-vet:
    name: gofmt / go vet
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.backend_workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: gofmt (fails on unformatted files)
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "Los siguientes archivos no están formateados con gofmt:"
            echo "$fmt_out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...

  lint:
    name: golangci-lint
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.backend_workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: backend
          args: --timeout=5m

  sqlc-diff:
    name: sqlc generate (sin diffs pendientes)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.backend_workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.27.0"
      - name: sqlc generate
        run: sqlc generate
      - name: Verificar que el código generado está actualizado
        run: |
          if ! git diff --quiet -- internal; then
            echo "El código generado por sqlc no coincide con los query.sql / migraciones."
            echo "Corre 'make generate-sql' localmente y commitea el resultado."
            git diff -- internal
            exit 1
          fi

  build-test-migrate:
    name: build, test y migraciones contra PostgreSQL
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.backend_workflow == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: commander_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: postgres://postgres:postgres@localhost:5432/commander_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: go build
        run: go build ./...
      - name: Instalar goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest
      - name: Aplicar migraciones
        run: goose -dir migrations postgres "$DB_URL" up
      - name: go test
        # -p 1: los tests de integración (auth, decks) comparten una única base
        # Postgres y hacen TRUNCATE de tablas comunes entre tests; correr los
        # test binaries de distintos paquetes en paralelo (default de `go test`)
        # los haría pisarse entre sí.
        run: go test -race -cover -p 1 ./...

  dockerfile-lint:
    name: hadolint (Dockerfile)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.backend_workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: backend/Dockerfile
