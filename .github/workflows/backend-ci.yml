name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  # Job sin filtro de path: siempre corre y siempre reporta un check, aunque
  # sea "skipped". Así los checks de abajo pueden marcarse como required en
  # branch protection sin dejar bloqueados los PRs que no tocan backend/
  # (un check requerido que nunca llega a dispararse deja el PR colgado).
  changes:
    name: Detectar cambios en backend/
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend-ci.yml'

  fmt-vet:
    name: gofmt / go vet
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: gofmt (fails on unformatted files)
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "Los siguientes archivos no están formateados con gofmt:"
            echo "$fmt_out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...

  lint:
    name: golangci-lint
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: backend
          args: --timeout=5m

  sqlc-diff:
    name: sqlc generate (sin diffs pendientes)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.27.0"
      - name: sqlc generate
        run: sqlc generate
      - name: Verificar que el código generado está actualizado
        run: |
          if ! git diff --quiet -- internal; then
            echo "El código generado por sqlc no coincide con los query.sql / migraciones."
            echo "Corre 'make generate-sql' localmente y commitea el resultado."
            git diff -- internal
            exit 1
          fi

  build-test-migrate:
    name: build, test y migraciones contra PostgreSQL
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: commander_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: postgres://postgres:postgres@localhost:5432/commander_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: go build
        run: go build ./...
      - name: Instalar goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest
      - name: Aplicar migraciones
        run: goose -dir migrations postgres "$DB_URL" up
      - name: go test
        run: go test -race -cover ./...

  dockerfile-lint:
    name: hadolint (Dockerfile)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
