name: Docs CI (sources of truth)

# Validates the project's sources of truth (see README.md, section 3):
# OpenAPI (docs/api/openapi.yaml) and DBML (docs/database/schema.dbml).

on:
  push:
    branches: [main]
  pull_request:

# On pull_request a new push cancels the branch's in-flight run, which is the
# usual CI-time saving. On push to main each commit gets its own group instead,
# so a merge landing seconds after another never cancels the earlier commit's
# run: a cancelled run reports neither success nor failure, which leaves that
# commit with no check result and blocks anything gated on CI passing.
concurrency:
  group: docs-ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # No path filter on the workflow itself: it always runs and always reports a
  # check (even a "skipped" one), so these jobs can be marked as required in
  # branch protection without leaving PRs that don't touch these files hanging.
  changes:
    name: Detect changes in docs
    runs-on: ubuntu-latest
    outputs:
      openapi: ${{ steps.filter.outputs.openapi }}
      dbml: ${{ steps.filter.outputs.dbml }}
      schema: ${{ steps.filter.outputs.schema }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            openapi:
              - 'docs/api/**'
              - '.spectral.yaml'
              - '.github/workflows/docs-ci.yml'
            dbml:
              - 'docs/database/**'
              - '.github/workflows/docs-ci.yml'
            # The drift check compares the DBML against the migrations, so a
            # migration alone can invalidate it without docs/ being touched at
            # all -- which is exactly how deck_resync_jobs went undocumented.
            schema:
              - 'docs/database/**'
              - 'backend/migrations/**'
              - '.github/scripts/check-dbml-matches-migrations.sh'
              - '.github/workflows/docs-ci.yml'

  openapi-lint:
    name: Lint OpenAPI (Spectral)
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Spectral lint
        run: npx --yes @stoplight/spectral-cli lint docs/api/openapi.yaml --ruleset .spectral.yaml

  dbml-validate:
    name: Validate DBML (compiles to SQL)
    needs: changes
    if: needs.changes.outputs.dbml == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: dbml2sql
        run: npx --yes -p @dbml/cli dbml2sql docs/database/schema.dbml --postgres -o /tmp/schema.sql

  # dbml-validate above only proves the DBML is well-formed. This one proves it
  # is TRUE: it builds the schema twice in the same Postgres -- once from the
  # goose migrations, once from the compiled DBML -- and diffs what
  # information_schema reports. See the script for what is and isn't compared.
  schema-drift:
    name: schema.dbml matches the migrations
    needs: changes
    if: needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # Same pin as backend-ci.yml's own "Install goose" step, deliberately:
      # two jobs applying the same migrations with different goose releases is
      # a difference waiting to be debugged. See that file for why the pin is
      # v3.27.0 rather than a newer one.
      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.27.0

      - name: Compare schema.dbml against the migrations
        run: bash .github/scripts/check-dbml-matches-migrations.sh
