name: Docs CI (fuentes de verdad)

# Valida las fuentes de verdad del proyecto (ver README.md, sección 3):
# OpenAPI (docs/api/openapi.yaml) y DBML (docs/database/schema.dbml).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Sin filtro de path: siempre corre y siempre reporta un check (aunque sea
  # "skipped"), para que estos jobs puedan marcarse como required en branch
  # protection sin dejar colgados los PRs que no tocan estos archivos.
  changes:
    name: Detectar cambios en docs
    runs-on: ubuntu-latest
    outputs:
      openapi: ${{ steps.filter.outputs.openapi }}
      dbml: ${{ steps.filter.outputs.dbml }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            openapi:
              - 'docs/api/**'
              - '.spectral.yaml'
              - '.github/workflows/docs-ci.yml'
            dbml:
              - 'docs/database/**'
              - '.github/workflows/docs-ci.yml'

  openapi-lint:
    name: Lint OpenAPI (Spectral)
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Spectral lint
        run: npx --yes @stoplight/spectral-cli lint docs/api/openapi.yaml --ruleset .spectral.yaml

  dbml-validate:
    name: Validar DBML (compila a SQL)
    needs: changes
    if: needs.changes.outputs.dbml == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: dbml2sql
        run: npx --yes -p @dbml/cli dbml2sql docs/database/schema.dbml --postgres -o /tmp/schema.sql
