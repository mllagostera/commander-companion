name: Docs CI (sources of truth)

# Validates the project's sources of truth (see README.md, section 3):
# OpenAPI (docs/api/openapi.yaml) and DBML (docs/database/schema.dbml).

on:
  push:
    branches: [main]
  pull_request:

# On pull_request a new push cancels the branch's in-flight run, which is the
# usual CI-time saving. On push to main each commit gets its own group instead,
# so a merge landing seconds after another never cancels the earlier commit's
# run: a cancelled run reports neither success nor failure, which leaves that
# commit with no check result and blocks anything gated on CI passing.
concurrency:
  group: docs-ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # No path filter on the workflow itself: it always runs and always reports a
  # check (even a "skipped" one), so these jobs can be marked as required in
  # branch protection without leaving PRs that don't touch these files hanging.
  changes:
    name: Detect changes in docs
    runs-on: ubuntu-latest
    outputs:
      openapi: ${{ steps.filter.outputs.openapi }}
      dbml: ${{ steps.filter.outputs.dbml }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            openapi:
              - 'docs/api/**'
              - '.spectral.yaml'
              - '.github/workflows/docs-ci.yml'
            dbml:
              - 'docs/database/**'
              - '.github/workflows/docs-ci.yml'

  openapi-lint:
    name: Lint OpenAPI (Spectral)
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Spectral lint
        run: npx --yes @stoplight/spectral-cli lint docs/api/openapi.yaml --ruleset .spectral.yaml

  dbml-validate:
    name: Validate DBML (compiles to SQL)
    needs: changes
    if: needs.changes.outputs.dbml == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: dbml2sql
        run: npx --yes -p @dbml/cli dbml2sql docs/database/schema.dbml --postgres -o /tmp/schema.sql
